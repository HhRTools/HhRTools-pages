<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HhRTools - Add-ins for Autodesk Fusion 360</title>
    <style>
        body { 
            font-family: sans-serif; 
            line-height: 1.6; 
            color: #333; 
            background-color: #fafafa;
            margin: 0;
            padding: 0;
            /* Zentriert den gesamten Inhaltsblock auf der Seite */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 700px;
            background: #ffffff;
            padding: 40px;
            margin: 40px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            /* Hält den Text innerhalb des zentrierten Blocks linksbündig */
            text-align: left; 
        }
        h1 { 
            font-size: 2.5em;
            border-bottom: 2px solid #eee; 
            padding-bottom: 12px; 
            margin-top: 0;
        }
        h2 { 
            font-size: 1.4em;
            margin-top: 30px; 
        }
        ul {
            padding-left: 20px;
        }
        li {
            margin-bottom: 10px;
        }
        .footer-section {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            font-size: 0.95em;
        }
        .privacy-link {
            color: #666;
            text-decoration: none;
        }
        .privacy-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Der Container sitzt zentriert, der Text darin ist linksbündig -->
    <div class="container">
        <h1>HhRTools</h1>

        <p>HhRTools develops add-ins and tools for Autodesk Fusion 360, focused on parametric pattern generation for design, laser cutting, engraving, and 3D printing workflows.</p>

        <h2>Products:</h2>
        <ul>
            <li><strong>Multipattern:</strong> 13 parametric surface pattern generators for Fusion 360</li>
        </ul>

        <!-- Bereich für Support und Rechtliches -->
        <div class="footer-section">
            <span>Support: <a href="mailto:HhRTools@gmail.com">HhRTools</a></span>
            <a class="privacy-link" href="privacy.html">Privacy Policy</a>
        </div>
    </div>

</html>
